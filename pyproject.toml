[project]
name = "receipts"
version = "0.1.0"
description = "Claim-by-claim audit receipts for AI output in financial services (TLG Systems)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.116",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
